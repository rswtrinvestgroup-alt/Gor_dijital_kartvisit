services:
  - type: web
    name: gor-kartvisit-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: WEBHOOK_URL
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
